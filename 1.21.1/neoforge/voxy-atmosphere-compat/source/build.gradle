plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.+'
}

group = 'dev.soulvoid'
version = project.mod_version
base.archivesName = 'voxy-atmosphere-compat'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://maven.nonamecrackers2.dev/releases'; name = 'nonamecrackers2' }
    flatDir { dirs 'libs' }
}

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft
        mappingsVersion = project.parchment_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
    }

    mods {
        voxyatmocompat {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Every bridged mod is provided at runtime by the modpack and is never bundled.
    // See libs/README.md for the jars to drop in.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    // Simple Clouds public API (ModifyCloudRenderDistanceEvent). Bundled inside Simple Clouds at runtime.
    compileOnly 'nonamecrackers2:simplecloudsapi-neoforge:1.4-1.21.1'
}

tasks.named('processResources', ProcessResources) {
    final def props = [mod_version: project.mod_version]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'   : 'voxy-atmosphere-compat',
            'Specification-Version' : project.version,
            'Implementation-Title'  : 'Voxy Atmosphere Compat',
            'Implementation-Version': project.version
        ])
    }
}
